<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jari Pintar - Teka Bahasa Isyarat</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>

    <a href="#" onclick="window.close(); return false;" class="btn-exit-game">
        <span class="icon">🏠</span> 
        <span class="text">KELUAR KE LOG IN</span>
    </a>

    <div class="game-container">
        <div id="overlay">
            <h2>GAME OVER</h2>
            <p id="final-score">Anda mengumpul 0 bintang!</p>
            <button class="restart-btn" onclick="resetGame()">Main Semula</button>
        </div>

        <div class="header">
            <div class="stat-box lives">❤️ <span id="lives">3</span></div>
            <div class="stat-box stars">⭐ <span id="stars">0</span></div>
        </div>

        <h1>Teka Bahasa Isyarat</h1>

        <div class="image-card">
            <img id="sign-image" src="" alt="Sila tunggu...">
        </div>

        <input type="text" id="answer-input" placeholder="Apa maksud isyarat ini?" autocomplete="off">
        <button id="submit-btn" onclick="checkAnswer()">SEMAK JAWAPAN</button>

        <div id="message"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
